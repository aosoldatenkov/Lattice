[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lattice"
version = "0.1.0"
description = "Computational toolkit for integral lattices, genus theory, and Vinberg's algorithm for hyperbolic reflection groups"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "sympy>=1.14",
    "python-flint>=0.8",
    "hsnf>=0.4",
    "pycddlib>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
    "ipykernel>=7.3",
    "matplotlib>=3.11",
    "cypari2>=2.2.4",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/lattice"]
cmake.build-type = "Release"

[tool.uv]
# Rebuild the C++ extensions on `uv sync` whenever their sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/cpp/*" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Research/math code: single-letter variable names (A, L, M, U, ...) are intentional.
select = ["E", "F", "W"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Scratchpads import the whole public API
"experiments/run.py" = ["F403", "F405"]
"notebooks/*.ipynb" = ["F403", "F405"]
